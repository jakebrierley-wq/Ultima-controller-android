name: Build Android APK

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Reject bundled game assets
        run: |
          if git ls-files | grep -Eiq '(^|/)(ultima\.exe|[^/]+\.(exe|com|sav|img|iso|cue|dosz))$'; then
            echo "Executable, save, or disk-image game files must not be committed."
            exit 1
          fi
          if git ls-files 'app/src/main/assets/game/**' | grep -q .; then
            echo "Game assets must be imported at runtime, not packaged."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest

      - name: Run Android lint
        run: gradle :app:lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UltimaController-debug
          path: app/build/outputs/apk/debug/app-debug.apk
